<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05070c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Ballin — AAA portrait basketball." />
    <title>BALLIN</title>
    <style>
      :root {
        color-scheme: dark;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
        --safe-l: env(safe-area-inset-left, 0px);
        --safe-r: env(safe-area-inset-right, 0px);
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden;
        background: #05070c;
        font-family: ui-sans-serif, -apple-system, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-select: none; user-select: none;
        touch-action: none; overscroll-behavior: none;
      }
      #app { position: fixed; inset: 0; }
      #gl { display: block; width: 100%; height: 100%; touch-action: none; }
      #ui { position: absolute; inset: 0; pointer-events: none; }
      #boot {
        position: absolute; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px;
        background:
          radial-gradient(120% 80% at 50% 18%, #16203a 0%, #090d17 45%, #04060b 100%);
        transition: opacity 0.6s ease, visibility 0.6s;
      }
      #boot.hidden { opacity: 0; visibility: hidden; }
      #boot .mark {
        font-size: clamp(38px, 13vw, 74px); font-weight: 900; letter-spacing: 0.16em;
        background: linear-gradient(180deg, #fff 0%, #ffb347 58%, #d9722a 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
        text-shadow: 0 0 46px rgba(255, 150, 40, 0.28);
      }
      #boot .sub {
        font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
        color: #7f8ca6; font-weight: 600;
      }
      #boot .bar {
        width: min(240px, 58vw); height: 3px; border-radius: 3px;
        background: rgba(255, 255, 255, 0.09); overflow: hidden;
      }
      #boot .bar i {
        display: block; height: 100%; width: 0%;
        background: linear-gradient(90deg, #ff8a2b, #ffd27a);
        box-shadow: 0 0 14px rgba(255, 150, 40, 0.7);
        transition: width 0.28s ease;
      }
      #boot .tip { font-size: 11px; color: #55627a; letter-spacing: 0.06em; }
      #rotate {
        position: absolute; inset: 0; z-index: 200; display: none;
        align-items: center; justify-content: center; flex-direction: column; gap: 14px;
        background: #05070c; color: #93a0b8; font-size: 13px; letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      @media (orientation: landscape) and (max-height: 520px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="gl"></canvas>
      <div id="ui"></div>
      <div id="boot">
        <div class="mark">BALLIN</div>
        <div class="sub">Street Rules</div>
        <div class="bar"><i id="bootbar"></i></div>
        <div class="tip" id="boottip">Warming up the arena…</div>
      </div>
      <div id="rotate"><div>↻</div><div>Rotate to portrait</div></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
